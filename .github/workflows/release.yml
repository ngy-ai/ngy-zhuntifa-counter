name: Release APK

# 打 v* 标签时自动构建并发到 Releases；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: 构建 Android 发行包
    runs-on: ubuntu-latest
    env:
      # 仓库锁文件用的是国内镜像，CI 在国外运行，切回官方源更稳
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 准备正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::发布标签版本必须配置 ANDROID_KEYSTORE_BASE64 等签名 Secrets"
              exit 1
            fi
            echo "未配置签名 Secrets，本次使用调试签名构建"
            exit 0
          fi
          mkdir -p android/key
          echo "$KEYSTORE_BASE64" | base64 -d > android/key/ngy-zhuntifa-release.p12
          {
            echo "storeFile=key/ngy-zhuntifa-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "已写入正式签名配置（alias: $KEY_ALIAS）"

      - name: 构建发行 APK
        run: flutter build apk --release

      - name: 整理产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/zhunti-counter-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhunti-counter-apk
          path: dist/*.apk

      - name: 核对 APK 签名
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -maxdepth 3 -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist/*.apk | head -n 12
          else
            echo "未找到 apksigner，跳过签名核对"
          fi

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 准提法计数器 ${{ github.ref_name }}
          body: |
            Android 安装包：下载下方 APK，传到手机安装即可（正式签名，可直接覆盖升级）。
          files: dist/*.apk
          generate_release_notes: true
