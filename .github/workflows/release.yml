name: Release APK

# 打 v* 标签时自动构建并发到 Releases；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: 构建 Android 发行包
    runs-on: ubuntu-latest
    env:
      # 仓库锁文件用的是国内镜像，CI 在国外运行，切回官方源更稳
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建发行 APK
        run: flutter build apk --release

      - name: 整理产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/zhunti-counter-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhunti-counter-apk
          path: dist/*.apk

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 准提法计数器 ${{ github.ref_name }}
          body: |
            Android 安装包：下载下方 APK，传到手机安装即可（当前使用调试签名）。
          files: dist/*.apk
          generate_release_notes: true
